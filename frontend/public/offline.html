<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEDA24 – Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9; color: #1e293b; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 360px; width: 100%;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .hint { margin-top: 14px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📴</div>
    <h1>Keine Internetverbindung</h1>
    <p>Die App konnte nicht geladen werden, weil gerade keine Verbindung besteht.
       Sobald du wieder online bist, lädt sie automatisch.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
    <div class="hint">Bereits erfasste Stempel bleiben lokal gespeichert und werden
       bei nächster Verbindung übertragen.</div>
  </div>
</body>
</html>
