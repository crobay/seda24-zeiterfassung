let currentLang = 'de';

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-de').classList.toggle('active', lang === 'de');
  document.getElementById('btn-hr').classList.toggle('active', lang === 'hr');
  document.getElementById('page-title').textContent = lang === 'de' ? 'Hilfe & h\u00e4ufige Fragen' : 'Pomo\u0107 & \u010desta pitanja';
  document.getElementById('page-subtitle').textContent = lang === 'de' ? 'SEDA24 Geb\u00e4udereinigung' : 'SEDA24 \u010ci\u0161\u0107enje zgrada';
  document.getElementById('back-text').textContent = lang === 'de' ? 'Zur\u00fcck zur App' : 'Natrag u aplikaciju';
  document.getElementById('guide-iphone').textContent = lang === 'de' ? 'iPhone \u2013 so geht\'s' : 'iPhone \u2013 upute';
  document.getElementById('guide-iphone-sub').textContent = lang === 'de' ? 'App installieren, stempeln, offline' : 'Instalacija, \u0161templ, offline (na njema\u010dkom)';
  renderFAQ();
}

function renderFAQ() {
  const data = faqs[currentLang];
  const container = document.getElementById('faq-container');
  let html = '';
  data.sections.forEach(section => {
    html += '<div class="section-title">' + section.title + '</div>';
    section.items.forEach(item => {
      html += '<div class="faq-item" onclick="toggleFAQ(this)">';
      html += '<button class="faq-question">' + item.q + '</button>';
      html += '<div class="faq-answer">' + item.a + '</div>';
      html += '</div>';
    });
  });
  container.innerHTML = html;
}

function toggleFAQ(el) {
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(item => item.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

renderFAQ();
</script>
